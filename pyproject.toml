[project]
name = "llauncher"
version = "0.1.0"
description = "Llauncher — llama-server configurator and runner for Linux (PySide6/Qt)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Llauncher" }]
dependencies = [
  "PySide6>=6.7",
]

[project.scripts]
llauncher = "llauncher.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llauncher"]

[tool.hatch.build.targets.wheel.force-include]
"assets/icon.png" = "llauncher/data/icon.png"
"assets/icon.ico" = "llauncher/data/icon.ico"

[tool.ruff]
line-length = 100
target-version = "py310"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
